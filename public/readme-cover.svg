<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">CMC Lens research workspace</title>
<desc id="desc">A dark research desk illustration connects a market movement map to evidence and a saved thesis.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1112"/><stop offset="1" stop-color="#111d20"/></linearGradient>
  <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a9d955"/><stop offset="1" stop-color="#e1ff94"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cb8ff" stop-opacity=".85"/><stop offset="1" stop-color="#83e0cc" stop-opacity=".35"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#b2e959" stop-opacity=".18"/><stop offset="1" stop-color="#b2e959" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#cce4d5" stroke-opacity=".06"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="36"/></filter>
</defs>
<rect width="1600" height="720" rx="32" fill="url(#bg)"/>
<rect width="1600" height="720" rx="32" fill="url(#grid)"/>
<circle cx="1280" cy="90" r="300" fill="url(#glow)" filter="url(#blur)"/>
<path d="M46 0v720" stroke="#d4f879" stroke-opacity=".55"/>
<g font-family="Inter,Arial,sans-serif">
  <text x="94" y="86" fill="#d4f879" font-size="15" letter-spacing="3">CMC LENS · RESEARCH WORKSPACE</text>
  <text x="94" y="224" fill="#f0f4ee" font-size="74" font-weight="600" letter-spacing="-4">The market moves.</text>
  <text x="94" y="312" fill="#d4f879" font-size="74" font-family="Georgia,serif" font-style="italic" letter-spacing="-3">Keep the context.</text>
  <text x="98" y="373" fill="#9caea7" font-size="20">Follow what moved together. Preserve the evidence.</text>
  <text x="98" y="403" fill="#9caea7" font-size="20">Come back to your view with the same facts in reach.</text>
  <g transform="translate(98 487)">
    <rect width="171" height="42" rx="21" fill="#d4f879"/>
    <text x="23" y="27" fill="#18220e" font-size="12" font-weight="700" letter-spacing="1">MARKET PULSE</text>
    <rect x="184" width="174" height="42" rx="21" fill="#182425" stroke="#354748"/>
    <text x="208" y="27" fill="#d5e0d8" font-size="12" font-weight="600" letter-spacing="1">MARKET ATLAS</text>
    <rect x="371" width="178" height="42" rx="21" fill="#182425" stroke="#354748"/>
    <text x="396" y="27" fill="#d5e0d8" font-size="12" font-weight="600" letter-spacing="1">THESIS MEMORY</text>
  </g>
  <text x="98" y="626" fill="#71847b" font-size="13" letter-spacing="1.4">SOURCE FACTS · DERIVED CONTEXT · YOUR REASONING</text>
</g>
<g transform="translate(752 84)">
  <rect width="780" height="552" rx="24" fill="#101819" stroke="#364548"/>
  <path d="M0 65h780" stroke="#29383a"/>
  <circle cx="30" cy="32" r="5" fill="#d4f879"/><circle cx="49" cy="32" r="5" fill="#76908c"/><circle cx="68" cy="32" r="5" fill="#536967"/>
  <text x="105" y="36" fill="#9bada5" font-size="12" letter-spacing="1.5">MARKET PULSE / RELATIONSHIPS</text>
  <g transform="translate(34 98)">
    <text x="0" y="0" fill="#74867e" font-size="10" letter-spacing="1.5">OBSERVATION FIELD</text>
    <rect y="18" width="420" height="316" rx="16" fill="#0d1415" stroke="#2c3d3c"/>
    <path d="M210 32v290M18 176h384" stroke="#344343" stroke-dasharray="3 7"/>
    <ellipse cx="206" cy="172" rx="120" ry="78" fill="none" stroke="#50605a" stroke-opacity=".55" stroke-dasharray="3 8"/>
    <ellipse cx="206" cy="172" rx="74" ry="47" fill="none" stroke="#50605a" stroke-opacity=".55" stroke-dasharray="3 8"/>
    <path d="M67 234c70-48 108-2 158-54s98-18 154-88" fill="none" stroke="url(#lime)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M56 258c65-37 125-18 172-69s93-34 162-61" fill="none" stroke="url(#blue)" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
    <g fill="#d4f879"><circle cx="225" cy="179" r="8"/><circle cx="286" cy="126" r="5"/><circle cx="358" cy="92" r="4"/></g>
    <g fill="#8cb8ff"><circle cx="152" cy="199" r="6"/><circle cx="320" cy="183" r="5"/><circle cx="93" cy="241" r="4"/></g>
    <g fill="#f4b56f"><circle cx="258" cy="102" r="4"/><circle cx="126" cy="149" r="3"/></g>
    <circle cx="225" cy="179" r="19" fill="none" stroke="#d4f879" stroke-opacity=".38"/>
    <text x="16" y="366" fill="#73857d" font-size="10" letter-spacing="1.1">RELATIVE MOVE VS. COVERED PEERS</text>
    <g transform="translate(454 0)">
      <text x="0" y="0" fill="#74867e" font-size="10" letter-spacing="1.5">RESEARCH TRAIL</text>
      <rect y="18" width="264" height="316" rx="16" fill="#121c1d" stroke="#2c3d3c"/>
      <text x="20" y="54" fill="#d4f879" font-size="10" letter-spacing="1.3">01 · OBSERVE</text>
      <text x="20" y="82" fill="#edf3ec" font-size="17" font-weight="600">A move separates</text>
      <text x="20" y="105" fill="#edf3ec" font-size="17" font-weight="600">from its peer group.</text>
      <path d="M20 129h220" stroke="#2c3d3c"/>
      <text x="20" y="158" fill="#90a39a" font-size="11">CMC listing snapshot</text>
      <text x="20" y="177" fill="#71847b" font-size="10">Source receipt attached</text>
      <circle cx="24" cy="220" r="4" fill="#8cb8ff"/>
      <path d="M24 220v39" stroke="#405655" stroke-dasharray="3 4"/>
      <text x="40" y="224" fill="#dce7df" font-size="11">02 · COMPARE</text>
      <text x="40" y="244" fill="#83968d" font-size="10">Keep the cohort matched</text>
      <circle cx="24" cy="282" r="4" fill="#d4f879"/>
      <text x="40" y="286" fill="#dce7df" font-size="11">03 · REVIEW</text>
      <text x="40" y="306" fill="#83968d" font-size="10">Return to the thesis later</text>
    </g>
  </g>
  <text x="36" y="520" fill="#72847d" font-size="11" letter-spacing="1.3">DESCRIPTIVE CONTEXT · NO PRICE PREDICTIONS</text>
</g>
</svg>